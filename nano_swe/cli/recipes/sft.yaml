# SFT recipe (e.g. warm-starting from OpenHands SWE-Gym trajectories before RL).
#
# Launch with: bash nano_swe/cli/recipes/sft.sh
# (or directly: torchrun --standalone --nproc_per_node=8 -m nano_swe.cli.train_sft --config nano_swe/cli/recipes/sft.yaml)
#
# Every key below is a real flag in nano_swe/cli/train_sft.py (+ nano_swe/cli/common_args.py) —
# this file is a complete, literal picture of the CLI surface, not just the handful of values a
# "quick start" needs. Every value is that flag's own CLI default EXCEPT the ones marked
# "(required)" (no valid default exists) or "(recipe choice)" (a name/path naturally scoped to
# this recipe, or a default not worth keeping for this use case). See each flag's --help text.
#
# KNOWN GAP: data.dataset must resolve through nano_swe.datasets.SFTDataset / blending_datasets,
# which don't exist yet (same gap as the RL recipe's prompt_dataset).

# FSDP2 / AutoModel backend (identical surface for SFT + RL).
fsdp:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  offload: none # none | optimizer | full
  param_dtype: bf16 # bf16 | fp16
  attn_implementation: flash_attention_2 # sdpa | eager | flex | te | flash_attention_2
  packing_samples: false

# Optimizer + LR scheduler + grad clip (unprefixed for SFT).
optim: adam # adam | muon
muon:
  lr: 0.02
  momentum: 0.95
  weight_decay: null
  ns_steps: 5
  nesterov: true
adam:
  lr: 5.0e-6
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
lr_scheduler: constant
lr_warmup_ratio: 0.03
min_lr_ratio: 0.1
max_norm: 1.0

# Resumable-checkpoint retention + final HF export.
ckpt:
  output_dir: ./ckpt
  save_steps: -1
  save_hf: false
  disable_final_save: false
  path: ./ckpt/checkpoints_sft
  max_num: 3
  dcp_max_num: null
  max_mem: .inf
  load_enable: false

# wandb + TensorBoard sinks and logging cadence.
logger:
  logging_steps: 1
  wandb:
    key: null
    org: null
    group: null
    project: nano-swe-sft # (recipe choice) CLI default is "molt_train_sft"
    run_name: null # unset -> "sft_<timestamp>"; override per run
  tensorboard_dir: null

model:
  model_name_or_path: null # (required) set via MODEL_PATH (see sft.sh) or edit here
  gradient_checkpoint: full # full | selective | none
  aux_loss_coef: 0 # MoE balancing loss
  freeze_visual_encoder: false

data:
  dataset: null # (required) path to the SFT jsonl/dataset
  dataset_probs: null # sampling probs across blended datasets
  dataset_split: train
  max_samples: 1000000
  max_len: 2048 # (recipe choice) agentic multi-turn traces will likely need this raised
  input_key: input
  output_key: null # (required) CLI default is null; needed to actually train on anything
  tokenizer_chat_template: null
  train_on_last_turn_only: false
  image_key: null
  max_images_per_prompt: 4
  disable_fast_tokenizer: false
  dataloader_num_workers: 0

train:
  micro_batch_size: 8
  batch_size: 128
  max_epochs: 2
  seed: 42
  full_determinism_enable: false

eval:
  dataset: null
  split: train
  steps: -1 # -1 evaluates once per epoch

# Runtime / misc (top-level, not namespaced by the CLI).
local_rank: -1 # set by torchrun; not meant to be edited here
use_ms: false # resolve models from ModelScope hub instead of HF
